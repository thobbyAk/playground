resolver 127.0.0.11 valid=10s;

# crm.local -- the "frontend domain": serves the CRM app and the bff.
server {
    listen 80;
    server_name crm.local;

    location /bff {
        set $bff_upstream bff:4001;
        proxy_pass http://$bff_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $crm_upstream crm:3000;
        proxy_pass http://$crm_upstream;
    }
}

server {
    listen 80;
    server_name api.local;

    location / {
        set $backend_upstream backend:4000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
